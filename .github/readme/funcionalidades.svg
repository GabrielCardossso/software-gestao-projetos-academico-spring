<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="534" viewBox="0 0 1200 534" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Funcionalidades de software-gestao-projetos-academico-spring</title>
<desc id="desc">Projetos e atividades: Cada atividade tem prioridade, prazo e situação (pendente, em andamento ou concluída) e pertence a um projeto. · Equipes: Uma equipe tem um gestor e vários desenvolvedores, que assumem atividades e projetos da própria equipe. · Atividades atrasadas: GET /atividade/atrasadas lista o que passou do prazo e não foi concluído, prioridade mais alta primeiro. · Login por perfil: Spring Security com sessão: GESTOR pode tudo; DESENVOLVEDOR consulta e cuida da situação das atividades. · Exclusão lógica: Nada é apagado: o setStatus alterna entre ativo e inativo e não desativa o que está em andamento. · Front-end de testes: Interface React que executa todos os endpoints, com formulários, tabelas e o resultado de cada chamada.</desc>
<style>
.mono{font-family:'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace}
text{shape-rendering:auto}
</style>
