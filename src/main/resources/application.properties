spring.application.name=trabalhoAlisson

# Conexão com o PostgreSQL. A senha vem só da variável de ambiente DB_SENHA (nunca do repositório).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trabalhoAlisson}
spring.datasource.username=${DB_USUARIO:postgres}
spring.datasource.password=${DB_SENHA}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docss
# O Swagger envia o token CSRF (cookie XSRF-TOKEN) nas requisições POST/PUT
springdoc.swagger-ui.csrf.enabled=true
# Frontend React autorizado a chamar a API (CORS). Vários endereços: separar por vírgula.
app.cors.origens=${CORS_ORIGENS:http://localhost:5173}
# Senha dada aos usuários que ainda não têm senha. Vazia = gera uma aleatória e mostra no console.
app.senha-inicial=${SENHA_INICIAL:12345678}